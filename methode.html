      <figcaption class="vh">Film de trente secondes, en musique et sans paroles. Un client écrit&nbsp;: «&nbsp;Il nous faut un nom et un site avant mars.&nbsp;» Le film suit les cinq étapes de la méthode sur ce projet, Banc. Le cadrage, avec un devis au prix fixé d’avance et une livraison le 26&nbsp;février. La direction&nbsp;: nous cherchons le bon nom, le client valide la maquette. La production&nbsp;: chaque partie a son agent. Le contrôle&nbsp;: une pièce refusée repart, puis nous relisons tout. La livraison&nbsp;: tout appartient au client, Banc est en ligne. Le film se termine sur la question «&nbsp;Et votre projet&nbsp;?&nbsp;», puis sur le logo de Topiary.</figcaption>
